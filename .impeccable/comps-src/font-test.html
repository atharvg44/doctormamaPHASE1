<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>body{background:#F1E7D3;margin:0;padding:20px} p{font-family:'Noto Serif Devanagari',serif;font-size:30px;line-height:48px;color:#1A1409} span{font-family:'Noto Sans Devanagari',sans-serif;font-size:17px}</style>
</head><body><p>काय त्रास होतोय? छाती व हृदय</p><span>बोलून सांगा किंवा क्रमांक निवडा.</span>
<script>document.fonts.ready.then(()=>{document.title='fonts:'+[...document.fonts].filter(f=>f.status==='loaded').map(f=>f.family).join('|')})</script>
</body></html>
